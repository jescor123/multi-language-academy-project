<div class="container-xl">
    <div class="table-responsive">
      <div class="table-wrapper">
        <div class="table-title">
          <div class="row">
            <div class="col-sm-6">
              <h4><b>List of speaking clubs </b></h4>
            </div>        
          </div>
        </div>       
                <table class="table table-dark">
                  <thead>
                    <tr class="center-align">
                        <th>Name</th>   
                        <th>Description</th>
                        <th>Time</th> 
                        <th>Meeting Link</th>   
                        <th>More information</th>                  
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let item of data" class="center-align">
                        <td>{{ item.name }}</td>  
                        <td>{{ item.description }}</td>
                        <td>{{ item.meetingTime }}</td>
                        <td><a routerLink="{{ item.meetingLink }}">{{ item.meetingLink }}</a></td>
                        <td>                             
                             <iframe width="320" height="240" [src]="urlSanitizer(item.informationVideo)">
                             </iframe>
                        </td>                                                        
                    </tr>                   
                  </tbody>
                </table>
      </div>
    </div>
</div>
