<div class="content" role="main">

    <div class="container shadow min-vh-100 py-2" style="width: 1000px;">
        <div class="row">
            <div class="col">
                <h2 class="font-weight-light"><p class="text-center">Reading</p></h2>
                  <div class="d-flex align-items-center">                    
                     <img [src]="imageSrc" style="width: 500px;height: 500px;"/>
                  </div>                  
            </div>            
            <div class="col">
                <h2 class="font-weight-light"><p class="text-center">Record audio here 😊</p></h2>

                  <div class="row justify-content-center pt-2 pb-2">
                    <button title="Click here to start recording action" class="btn-mic w-auto" (click)="startRecording()"
                      *ngIf="!isRecording" style="margin-right: 3px;">
                      <img src="assets/images/play.png" style="width: 20px;height: 20px;" alt="Click here to start recording"/>
                    </button>
                    <button title="Click here to stop recording" class="btn-stop w-auto" (click)="stopRecording()" *ngIf="isRecording"
                      style="margin-right: 3px;">
                      <img src="assets/images/stop.jpg" style="width: 20px;height: 20px;" alt="Click here to stop recording"/>
                    </button>
                    <audio #audioPlayer controls style="margin: 10px;"></audio>                    
                  </div>       
                  
                  <div class="row justify-content-center pt-2 pb-2">
                    <a *ngIf="audioURL" [href]="audioURL" download="recorded_audio.wav">Download last reecorded Audio</a>
                  </div>
                                                              
            </div>
        </div>
    </div>

    
   
</div>
