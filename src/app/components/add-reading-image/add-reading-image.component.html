
   <div class="submit-form">
      <div *ngIf="!submitted">
        <div class="form-group">
          <input
            type="text"
            class="form-control"
            id="id"
            required
            [(ngModel)]="question.id"
            name="id"
            hidden
          />
        </div>
  
        <div class="form-group">
          <input
            class="form-control"
            id="idCategory"
            required
            [(ngModel)]="question.idCategory"
            name="idCategory"
            hidden
          />
        </div>      

         <div class="row">
           <div class="col-sm-6">
             <h4><b>Upload image for reading</b></h4>
             <br>
           </div>        
         </div>
             
         <div class="container d-flex justify-content-left">
     
             <div class="center-align">      
               <div class="col-10 mb-3">
                 <label class="px-3">Select File: </label>
                 <input type="file" (change)="selectFile($event)" />
               </div>    
               <br><br><br>  
               <button class="btn btn-primary ml-1" (click)="saveData()">
                 Apply changes
               </button>
             </div>
     
         </div>

   </div>
